version: '3.8'

services:
  postgres:
    container_name: postgres-safewalk
    image: postgis/postgis:16-3.4 # <--- L'astuce est ici : PostGIS est pré-installé !
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yassin123
      POSTGRES_DB: safewalk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
