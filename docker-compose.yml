version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: safewalk-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yassin123
      POSTGRES_DB: safewalk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
